name: Wheels

# Builds self-contained wheels (native dependencies bundled by auditwheel /
# delocate) for CPython 3.12-3.14 on Linux and macOS and tests each one in a
# clean environment. When a GitHub release is published, attaches them to the
# release and regenerates the pip index on GitHub Pages
# (https://<owner>.github.io/<repo>/simple/), so that
#   pip install dreal --extra-index-url https://<owner>.github.io/<repo>/simple/
# works.

on:
  push:
    branches: [ master, release ]
  pull_request:
    branches: [ master ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build_wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04        # manylinux_2_28 x86_64
          - os: ubuntu-24.04-arm    # manylinux_2_28 aarch64
          - os: macos-15            # arm64
            macosx_deployment_target: "15.0"
          - os: macos-15-intel      # x86_64
            macosx_deployment_target: "15.0"
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: remove-bazelisk
        if: runner.os == 'macOS'
        run: if command -v bazelisk >/dev/null; then brew uninstall bazelisk || true; fi
      - name: build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          # Homebrew's GMP is built for the runner's macOS version, so wheels
          # cannot target an older one.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  github_release:
    name: attach to GitHub release
    if: github.event_name == 'release'
    needs: [ build_wheels, build_sdist ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release upload "${{ github.event.release.tag_name }}" dist/* \
            --repo "${{ github.repository }}" --clobber

  pip_index:
    name: deploy pip index to GitHub Pages
    # Also runnable on its own (workflow_dispatch) to rebuild the index.
    if: always() && (needs.github_release.result == 'success' || github.event_name == 'workflow_dispatch')
    needs: [ github_release ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}simple/
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: generate index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/wheels/make_index.py "${{ github.repository }}" site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
